<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18-2 Canvas 全站系统架构图（电商系统）- 徐奔</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #14213d 0%, #080d1a 55%, #05080f 100%);
        color: #e2e8f0;
        min-height: 100vh;
        padding: 28px 20px 50px;
    }
    .wrap { max-width: 1240px; margin: 0 auto; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    h1 { font-size: 22px; letter-spacing: .5px; }
    h1 em { font-style: normal; color: #38bdf8; }
    .sub { color: #64748b; font-size: 13px; margin-top: 6px; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; }
    .tools button {
        border: 1px solid rgba(148,163,184,.3);
        background: rgba(15,23,42,.7);
        color: #cbd5e1;
        padding: 8px 15px;
        border-radius: 8px;
        font-size: 12.5px;
        font-family: inherit;
        cursor: pointer;
        transition: .2s;
    }
    .tools button:hover { border-color: #38bdf8; color: #38bdf8; }
    .tools button.on { background: #0ea5e9; border-color: #0ea5e9; color: #02121f; font-weight: 700; }

    .stage-box {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(56,189,248,.18);
        box-shadow: 0 26px 70px rgba(2,8,20,.75);
        background: #070c17;
    }
    canvas { display: block; width: 100%; height: auto; }

    #tip {
        position: absolute;
        pointer-events: none;
        max-width: 260px;
        padding: 10px 13px;
        border-radius: 9px;
        background: rgba(9,15,28,.96);
        border: 1px solid rgba(56,189,248,.45);
        box-shadow: 0 12px 32px rgba(0,0,0,.55);
        font-size: 12.5px;
        line-height: 1.7;
        color: #cbd5e1;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity .16s, transform .16s;
        z-index: 5;
    }
    #tip.show { opacity: 1; transform: translateY(0); }
    #tip b { display: block; color: #38bdf8; font-size: 13px; margin-bottom: 4px; }

    .legend {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
        margin-top: 16px;
        font-size: 12.5px;
        color: #64748b;
    }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
    .legend .dash {
        display: inline-block; width: 22px; height: 0;
        border-top: 2px dashed #64748b; margin-right: 6px; vertical-align: middle;
    }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <div>
            <h1>18-2 <em>Canvas 全站系统架构图</em> · 电商系统</h1>
            <div class="sub">纯 Canvas 2D 绘制：分层架构、连线箭头、数据流动画、悬停说明，可导出 PNG</div>
        </div>
        <div class="tools">
            <button id="btnFlow" class="on">数据流：开</button>
            <button id="btnReplay">重播动画</button>
            <button id="btnExport">导出 PNG</button>
        </div>
    </header>

    <div class="stage-box">
        <canvas id="cv" width="1240" height="880"></canvas>
        <div id="tip"></div>
    </div>

    <div class="legend">
        <span><i style="background:#38bdf8"></i>用户接入层</span>
        <span><i style="background:#818cf8"></i>接入网关层</span>
        <span><i style="background:#34d399"></i>业务服务层</span>
        <span><i style="background:#fbbf24"></i>中间件层</span>
        <span><i style="background:#f472b6"></i>数据存储层</span>
        <span><i style="background:#94a3b8"></i>运维保障层</span>
        <span><span class="dash"></span>虚线为监控 / 异步链路</span>
    </div>
</div>

<script>
(function () {
    'use strict';

    var LOGIC_W = 1240, LOGIC_H = 880;
    var canvas = document.getElementById('cv');
    var ctx = canvas.getContext('2d');
    var tip = document.getElementById('tip');

    var flowOn = true;
    var hovered = null;
    var startTime = performance.now();

    /* ================= 布局定义 ================= */
    // 左侧层名区宽度 140，内容区 x: 160 ~ 1200
    var LEFT = 160, RIGHT = 1200, LAYER_LABEL_X = 24;

    var LAYERS = [
        {
            key: 'user', name: '用户接入层', short: ['用户', '接入层'], color: '#38bdf8',
            y: 58, h: 70, cols: 4, rows: 1, gap: 22,
            items: [
                { label: 'PC 商城', sub: 'Vue3 + 微前端', desc: '面向桌面端的商品浏览与下单入口，多个子应用组合成统一站点。' },
                { label: '移动 App', sub: 'Android / iOS', desc: '原生 + H5 混合开发，承载个性化推荐与推送。' },
                { label: '微信小程序', sub: '社交电商入口', desc: '依托微信生态的轻量入口，支持拼团、分享裂变。' },
                { label: 'H5 触屏版', sub: '活动落地页', desc: '大促活动页，配合 CDN 抗住瞬时高并发访问。' }
            ]
        },
        {
            key: 'gateway', name: '接入网关层', short: ['接入', '网关层'], color: '#818cf8',
            y: 168, h: 70, cols: 3, rows: 1, gap: 60,
            items: [
                { label: 'CDN 静态加速', sub: '图片 · JS · CSS', desc: '静态资源下发到边缘节点，就近访问，降低源站压力。' },
                { label: 'Nginx 负载均衡', sub: '反向代理 · 集群', desc: '四层/七层转发，按权重与健康检查分发到后端网关。' },
                { label: 'API 网关', sub: '鉴权 · 限流 · 路由', desc: '统一入口：Token 校验、接口限流、灰度路由、协议转换。' }
            ]
        },
        {
            key: 'service', name: '业务服务层', short: ['业务', '服务层'], color: '#34d399',
            y: 288, h: 70, cols: 4, rows: 2, gap: 22, gapY: 26,
            items: [
                { label: '用户服务', sub: '注册登录 · 会员等级', desc: '账号体系、实名认证、积分与会员权益。' },
                { label: '商品服务', sub: 'SPU / SKU · 类目', desc: '商品主数据、类目属性、上下架与价格管理。' },
                { label: '订单服务', sub: '下单 · 状态机', desc: '订单创建、拆单、超时关单，核心状态机驱动流转。' },
                { label: '库存服务', sub: '扣减 · 预占', desc: '下单预占库存、支付扣减、取消回滚，防超卖。' },
                { label: '支付服务', sub: '支付 · 对账', desc: '对接微信/支付宝，处理回调、退款与日终对账。' },
                { label: '营销服务', sub: '优惠券 · 秒杀', desc: '优惠券发放、满减规则、秒杀库存预热与限流。' },
                { label: '搜索服务', sub: '检索 · 推荐', desc: '基于 ES 的商品检索，结合用户画像做排序推荐。' },
                { label: '物流服务', sub: '发货 · 轨迹', desc: '运单生成、物流轨迹同步、签收异常处理。' }
            ]
        },
        {
            key: 'middle', name: '中间件层', short: ['中间件'], color: '#fbbf24',
            y: 508, h: 70, cols: 4, rows: 1, gap: 22,
            items: [
                { label: 'Redis 缓存', sub: '热点数据 · 分布式锁', desc: '商品详情、购物车、秒杀令牌等热点数据的集中缓存。' },
                { label: 'Kafka 消息队列', sub: '异步解耦 · 削峰', desc: '下单后异步触发库存、积分、通知等下游流程。' },
                { label: 'Elasticsearch', sub: '全文检索', desc: '商品与订单的全文检索、聚合统计与日志检索。' },
                { label: '任务调度', sub: 'XXL-Job · 定时', desc: '超时关单、库存回补、报表统计等定时任务编排。' }
            ]
        },
        {
            key: 'data', name: '数据存储层', short: ['数据', '存储层'], color: '#f472b6',
            y: 618, h: 70, cols: 4, rows: 1, gap: 22,
            items: [
                { label: 'MySQL 集群', sub: '主从 · 分库分表', desc: '订单与商品主数据，读写分离 + 分库分表支撑海量数据。' },
                { label: 'MongoDB', sub: '文档型存储', desc: '存放商品详情富文本、日志型结构灵活的数据。' },
                { label: '对象存储 OSS', sub: '图片 · 视频', desc: '商品图片、视频素材的分布式存储，配合 CDN 回源。' },
                { label: '数据仓库', sub: '离线 · 实时数仓', desc: '订单、流量数据入仓，支撑经营报表与推荐特征。' }
            ]
        },
        {
            key: 'ops', name: '运维保障层', short: ['运维', '保障层'], color: '#94a3b8',
            y: 728, h: 70, cols: 4, rows: 1, gap: 22,
            items: [
                { label: '监控告警', sub: 'Prometheus + Grafana', desc: 'QPS、耗时、错误率、JVM 指标采集与阈值告警。' },
                { label: '日志中心', sub: 'ELK 链路追踪', desc: '集中采集日志，通过 TraceId 串联全链路调用。' },
                { label: 'CI / CD', sub: 'Jenkins · 灰度发布', desc: '代码构建、镜像打包、灰度与一键回滚。' },
                { label: '配置中心', sub: 'Nacos · 动态配置', desc: '限流阈值、开关、路由规则的动态下发。' }
            ]
        }
    ];

    /* ================= 计算节点坐标 ================= */
    var nodes = [];
    var nodeMap = {};

    LAYERS.forEach(function (layer) {
        var innerW = RIGHT - LEFT;
        var gapX = layer.gap;
        var cw = (innerW - gapX * (layer.cols - 1)) / layer.cols;
        var gapY = layer.gapY || 0;
        var ch = (layer.h - gapY * (layer.rows - 1)) / layer.rows;

        layer.items.forEach(function (item, i) {
            var r = Math.floor(i / layer.cols);
            var c = i % layer.cols;
            var node = {
                id: layer.key + '-' + i,
                layer: layer.key,
                color: layer.color,
                label: item.label,
                sub: item.sub,
                desc: item.desc,
                x: LEFT + c * (cw + gapX),
                y: layer.y + r * (ch + gapY),
                w: cw,
                h: ch,
                order: nodes.length
            };
            nodes.push(node);
            nodeMap[node.id] = node;
        });
    });

    // 按 id 取锚点
    function anchor(id, side) {
        var n = nodeMap[id];
        if (!n) return { x: 0, y: 0 };
        switch (side) {
            case 'top':    return { x: n.x + n.w / 2, y: n.y };
            case 'bottom': return { x: n.x + n.w / 2, y: n.y + n.h };
            case 'left':   return { x: n.x, y: n.y + n.h / 2 };
            default:       return { x: n.x + n.w, y: n.y + n.h / 2 };
        }
    }

    var links = [];

    function addLink(a, aSide, b, bSide, dashed, label) {
        var p1 = anchor(a, aSide), p2 = anchor(b, bSide);
        links.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, dashed: !!dashed, label: label || '' });
    }

    // 用户层 → 网关层（Nginx 为接入点）
    LAYERS[0].items.forEach(function (_, i) {
        addLink('user-' + i, 'bottom', 'gateway-1', 'top', false);
    });
    // 网关层内部
    addLink('gateway-0', 'right', 'gateway-1', 'left', false);
    addLink('gateway-1', 'right', 'gateway-2', 'left', false);
    // 网关 → 业务层
    addLink('gateway-2', 'bottom', 'service-1', 'top', false);
    addLink('gateway-2', 'bottom', 'service-2', 'top', false);
    addLink('gateway-2', 'bottom', 'service-6', 'top', false);
    // 业务层 → 中间件
    addLink('service-1', 'bottom', 'middle-0', 'top', false);
    addLink('service-2', 'bottom', 'middle-1', 'top', false);
    addLink('service-6', 'bottom', 'middle-2', 'top', false);
    // 中间件 → 数据层
    addLink('middle-0', 'bottom', 'data-0', 'top', false);
    addLink('middle-2', 'bottom', 'data-1', 'top', false);
    addLink('middle-1', 'bottom', 'data-3', 'top', false);
    // 运维虚线：监控 / 采集
    addLink('ops-0', 'top', 'data-0', 'bottom', true);
    addLink('ops-1', 'top', 'data-3', 'bottom', true);
    addLink('ops-3', 'top', 'service-7', 'bottom', true);

    /* ================= 绘制工具 ================= */
    function roundRect(c, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.quadraticCurveTo(x + w, y, x + w, y + r);
        c.lineTo(x + w, y + h - r);
        c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        c.lineTo(x + r, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - r);
        c.lineTo(x, y + r);
        c.quadraticCurveTo(x, y, x + r, y);
        c.closePath();
    }

    function hexToRgba(hex, a) {
        var n = parseInt(hex.slice(1), 16);
        return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    }

    function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

    /* ================= 主绘制 ================= */
    function draw(now) {
        var elapsed = now - startTime;

        ctx.clearRect(0, 0, LOGIC_W, LOGIC_H);

        // 背景
        var bg = ctx.createLinearGradient(0, 0, 0, LOGIC_H);
        bg.addColorStop(0, '#070c17');
        bg.addColorStop(1, '#050810');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, LOGIC_W, LOGIC_H);

        // 网格
        ctx.strokeStyle = 'rgba(56,189,248,.045)';
        ctx.lineWidth = 1;
        for (var gx = 0; gx < LOGIC_W; gx += 40) {
            ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, LOGIC_H); ctx.stroke();
        }
        for (var gy = 0; gy < LOGIC_H; gy += 40) {
            ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(LOGIC_W, gy); ctx.stroke();
        }

        // 各层背景容器 + 层名
        LAYERS.forEach(function (layer, li) {
            var appear = Math.min(1, Math.max(0, (elapsed - li * 90) / 420));
            var a = easeOut(appear);

            ctx.save();
            ctx.globalAlpha = a;

            var boxY = layer.y - 12;
            var boxH = layer.h + 24;
            roundRect(ctx, LAYER_LABEL_X, boxY, RIGHT - LAYER_LABEL_X + 20, boxH, 14);
            ctx.fillStyle = hexToRgba(layer.color, 0.045);
            ctx.fill();
            ctx.strokeStyle = hexToRgba(layer.color, 0.16);
            ctx.lineWidth = 1;
            ctx.stroke();

            // 左侧竖色条
            roundRect(ctx, LAYER_LABEL_X, boxY, 4, boxH, 2);
            ctx.fillStyle = hexToRgba(layer.color, 0.85);
            ctx.fill();

            // 层名：按语义拆成 1~2 行居中显示
            var lines = layer.short || [layer.name];
            var lineH = 19;
            var firstY = boxY + boxH / 2 - (lines.length - 1) * lineH / 2;

            ctx.fillStyle = hexToRgba(layer.color, 0.95);
            ctx.font = 'bold 14px "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            for (var li2 = 0; li2 < lines.length; li2++) {
                ctx.fillText(lines[li2], LAYER_LABEL_X + 18, firstY + li2 * lineH);
            }

            ctx.restore();
        });

        // 连线
        var dashOffset = -((now / 26) % 20);
        links.forEach(function (lk) {
            ctx.save();
            ctx.strokeStyle = lk.dashed ? 'rgba(148,163,184,.5)' : 'rgba(56,189,248,.42)';
            ctx.lineWidth = lk.dashed ? 1.6 : 2;
            if (lk.dashed) ctx.setLineDash([7, 6]);
            ctx.beginPath();
            ctx.moveTo(lk.x1, lk.y1);
            ctx.lineTo(lk.x2, lk.y2);
            ctx.stroke();
            ctx.restore();

            // 箭头
            drawArrow(lk.x1, lk.y1, lk.x2, lk.y2, lk.dashed ? 'rgba(148,163,184,.7)' : 'rgba(56,189,248,.75)');

            // 流动光点
            if (flowOn) {
                var period = 2600;
                var t = ((now + lk.y1 * 8) % period) / period;
                var px = lk.x1 + (lk.x2 - lk.x1) * t;
                var py = lk.y1 + (lk.y2 - lk.y1) * t;
                var rad = 3.4 * Math.sin(Math.PI * t) + 1.2;
                var grd = ctx.createRadialGradient(px, py, 0, px, py, rad * 3.4);
                grd.addColorStop(0, 'rgba(125,211,252,.95)');
                grd.addColorStop(1, 'rgba(125,211,252,0)');
                ctx.fillStyle = grd;
                ctx.beginPath();
                ctx.arc(px, py, rad * 3.4, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        // 节点卡片
        nodes.forEach(function (n) {
            var appear = Math.min(1, Math.max(0, (elapsed - 260 - n.order * 34) / 460));
            var a = easeOut(appear);
            if (a <= 0) return;

            var hover = hovered === n;
            ctx.save();
            ctx.globalAlpha = a;
            ctx.translate(0, (1 - a) * 16);

            // 卡片底
            roundRect(ctx, n.x, n.y, n.w, n.h, 10);
            var fill = ctx.createLinearGradient(n.x, n.y, n.x, n.y + n.h);
            fill.addColorStop(0, hexToRgba(n.color, hover ? 0.26 : 0.14));
            fill.addColorStop(1, hexToRgba(n.color, hover ? 0.12 : 0.05));
            ctx.fillStyle = fill;
            ctx.fill();

            ctx.strokeStyle = hexToRgba(n.color, hover ? 0.95 : 0.42);
            ctx.lineWidth = hover ? 2 : 1.2;
            ctx.stroke();

            if (hover) {
                ctx.shadowColor = hexToRgba(n.color, 0.55);
                ctx.shadowBlur = 18;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // 左色块
            roundRect(ctx, n.x + 8, n.y + 10, 3, n.h - 20, 2);
            ctx.fillStyle = hexToRgba(n.color, 0.8);
            ctx.fill();

            // 文字
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = hover ? '#ffffff' : '#dbeafe';
            ctx.font = 'bold 13.5px "Microsoft YaHei", sans-serif';
            ctx.fillText(n.label, n.x + n.w / 2 + 3, n.y + n.h / 2 - 9);

            ctx.fillStyle = 'rgba(148,163,184,.92)';
            ctx.font = '11px "Microsoft YaHei", sans-serif';
            ctx.fillText(n.sub, n.x + n.w / 2 + 3, n.y + n.h / 2 + 10);

            ctx.restore();
        });

        // 底部说明
        ctx.fillStyle = 'rgba(100,116,139,.85)';
        ctx.font = '12px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText('浏览器请求 → CDN / Nginx / API 网关 → 微服务集群 → 缓存与消息中间件 → 数据库，全链路由运维体系监控保障', LOGIC_W / 2, LOGIC_H - 22);

        requestAnimationFrame(draw);
    }

    function drawArrow(x1, y1, x2, y2, color) {
        var angle = Math.atan2(y2 - y1, x2 - x1);
        var len = 9;
        ctx.save();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - len * Math.cos(angle - 0.38), y2 - len * Math.sin(angle - 0.38));
        ctx.lineTo(x2 - len * Math.cos(angle + 0.38), y2 - len * Math.sin(angle + 0.38));
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    /* ================= DPR 与交互 ================= */
    function setupCanvas() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = LOGIC_W * dpr;
        canvas.height = LOGIC_H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function toLogic(clientX, clientY) {
        var rect = canvas.getBoundingClientRect();
        return {
            x: (clientX - rect.left) * LOGIC_W / rect.width,
            y: (clientY - rect.top) * LOGIC_H / rect.height
        };
    }

    canvas.addEventListener('mousemove', function (e) {
        var p = toLogic(e.clientX, e.clientY);
        var found = null;
        for (var i = 0; i < nodes.length; i++) {
            var n = nodes[i];
            if (p.x >= n.x && p.x <= n.x + n.w && p.y >= n.y && p.y <= n.y + n.h) {
                found = n;
                break;
            }
        }
        hovered = found;
        canvas.style.cursor = found ? 'pointer' : 'default';

        if (found) {
            var rect = canvas.getBoundingClientRect();
            var scale = rect.width / LOGIC_W;
            tip.innerHTML = '<b>' + found.label + ' · ' + found.sub + '</b>' + found.desc;
            tip.classList.add('show');
            var tx = (found.x + found.w / 2) * scale;
            var ty = (found.y + found.h) * scale + 12;
            tip.style.left = Math.max(8, Math.min(rect.width - 268, tx - 130)) + 'px';
            tip.style.top = Math.min(rect.height - 90, ty) + 'px';
        } else {
            tip.classList.remove('show');
        }
    });

    canvas.addEventListener('mouseleave', function () {
        hovered = null;
        tip.classList.remove('show');
    });

    document.getElementById('btnFlow').addEventListener('click', function () {
        flowOn = !flowOn;
        this.classList.toggle('on', flowOn);
        this.textContent = '数据流：' + (flowOn ? '开' : '关');
    });

    document.getElementById('btnReplay').addEventListener('click', function () {
        startTime = performance.now();
    });

    document.getElementById('btnExport').addEventListener('click', function () {
        var a = document.createElement('a');
        a.download = '电商系统架构图-canvas.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
    });

    setupCanvas();
    requestAnimationFrame(draw);
})();
</script>
</body>
</html>
