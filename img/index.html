<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 练习作品集 - CJXB818</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 32px;
            color: #764ba2;
        }
        .subtitle {
            color: #888;
            margin-bottom: 32px;
        }
        .card {
            display: block;
            padding: 20px 24px;
            margin-bottom: 14px;
            border: 2px solid #eee;
            border-radius: 10px;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s ease;
        }
        .card:hover {
            border-color: #764ba2;
            background: #f8f5ff;
            transform: translateX(6px);
            box-shadow: 0 4px 16px rgba(118, 75, 162, 0.15);
        }
        .card h3 {
            margin: 0 0 6px;
            color: #4a3a6a;
        }
        .card p {
            margin: 0;
            font-size: 14px;
            color: #888;
        }
        .badge {
            display: inline-block;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            background: #667eea;
            color: #fff;
            margin-left: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 HTML 练习作品集</h1>
        <p class="subtitle">CJXB818 · 徐奔 · 前端学习演示页面</p>

        <a href="15-1.html" class="card">
            <h3>15-1 逢七过 <span class="badge">JS</span></h3>
            <p>1~100 盒子，7 的倍数或含 7 的数字显示空盒子，其余显示数字</p>
        </a>

        <a href="5-1.html" class="card">
            <h3>5-1 层叠与继承 <span class="badge">CSS</span></h3>
            <p>CSS 选择器优先级、层叠规则与样式继承演示</p>
        </a>

        <a href="img/2-1.html" class="card">

        </a>

        <a href="img/2.2.html" class="card">
            <h3>2.2 表格与列表</h3>
            <p>表格、列表等结构化标签练习</p>
        </a>

        <a href="img/3-1 form.html" class="card">

        <a href="img/3.2 css.html" class="card">
            <h3>3-2 CSS 样式</h3>

        </a>

        <a href="img/4-1 Css2.html" class="card">
            <h3>4-1 CSS 进阶</h3>

        </a>

        <a href="img/5-1.html" class="card">
            <h3>img/5-1 CSS 特性</h3>
