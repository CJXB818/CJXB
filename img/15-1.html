<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逢七过 - 徐奔</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 800px;
            margin: 0 auto;
        }
        .box {
            width: 60px;
            height: 60px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid #4CAF50;
            border-radius: 6px;
            background-color: #fff;
            color: #333;
        }
        .box.empty {
            background-color: #4CAF50;
            border-color: #2E7D32;
            color: transparent;
        }
    </style>
</head>
<body>
    <h1>逢七过 — 徐奔</h1>
    <div class="container" id="container"></div>

    <script>
        var container = document.getElementById('container');
        for (var i = 1; i <= 100; i++) {
            var box = document.createElement('div');
            box.className = 'box';
            if (i % 7 === 0 || String(i).indexOf('7') !== -1) {
                box.classList.add('empty');
            } else {
                box.textContent = i;
            }
            container.appendChild(box);
        }
    </script>
</body>
</html>
