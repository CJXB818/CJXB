<!DOCTYPE html>
<!-- 项目：图像解决方案 · 下导航（SVG 方案）  作者：徐奔  班级：____  学号：____ -->
<!-- 与"字体图标方案"技术区别：本页使用内联 SVG 图标 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下导航 - SVG方案 - 徐奔</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --xb-primary:#1a2384;
    --xb-gradient:linear-gradient(100deg,#1a2384 0%,#3d2a9e 45%,#7a4ab5 100%);
    --xb-active:#ff7a2f;
    --xb-text:#1b2333;
    --xb-sub:#8c95a8;
    --xb-bg:#eef1f8;
    --xb-card:#ffffff;
    --xb-line:#e6eaf3;
  }
  body{ font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--xb-bg); color:var(--xb-text); }
  .xb-page{ max-width:1140px; margin:0 auto; min-height:100vh; padding-bottom:64px; }

  .xb-header{ background:var(--xb-gradient); color:#fff; padding:18px 16px 14px; }
  .xb-header h1{ font-size:18px; font-weight:700; }
  .xb-header p{ font-size:12px; opacity:.86; margin-top:4px; }

  .xb-content{ padding:14px; display:grid; gap:12px; }
  .xb-card{ background:var(--xb-card); border-radius:12px; padding:14px; box-shadow:0 4px 14px rgba(26,35,132,.06); display:flex; gap:12px; align-items:center; }
  .xb-thumb{ width:64px; height:48px; border-radius:8px; flex:0 0 auto; background:linear-gradient(135deg,#2b5cff,#7a4ab5); }
  .xb-card .xb-meta b{ font-size:14px; }
  .xb-card .xb-meta span{ display:block; font-size:12px; color:var(--xb-sub); margin-top:4px; }

  /* ===== 下导航：内联 SVG 方案（核心） ===== */
  .xb-tabbar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex;                /* flex 自适应宽度 */
    background:#fff;
    border-top:1px solid var(--xb-line);
    box-shadow:0 -4px 18px rgba(26,35,132,.08);
    z-index:50;
  }
  .xb-tabbar a{
    flex:0 0 auto;                /* 固定等分：每项 20% → 严格自适应 */
    width:20%;
    text-align:center;
    padding:8px 0 10px;
    color:var(--xb-sub);
    text-decoration:none;
    transition:color .2s;
    min-width:0;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .xb-tabbar a svg{
    width:24px; height:24px;      /* SVG 用 width/height 控制大小 */
    fill:currentColor;            /* 继承颜色，便于 CSS 修饰 */
  }
  .xb-tabbar a span{ font-size:11px; }
  .xb-tabbar a.is-active{ color:var(--xb-active); }
  .xb-tabbar a.is-active svg{ transform:translateY(-2px); }

  @media (min-width:768px){
    .xb-tabbar{ max-width:480px; left:50%; transform:translateX(-50%); border-radius:14px 14px 0 0; }
  }
</style>
</head>
<body>
  <div class="xb-page">
    <header class="xb-header">
      <h1>腾讯体育 · 移动版下导航</h1>
      <p>内联 SVG 方案 · 自适应宽度 · 作者 徐奔</p>
    </header>
    <main class="xb-content">
      <article class="xb-card"><div class="xb-thumb"></div><div class="xb-meta"><b>赛事速递</b><span>NBA / CBA / 欧冠 实时战报</span></div></article>
      <article class="xb-card"><div class="xb-thumb"></div><div class="xb-meta"><b>精彩集锦</b><span>进球、绝杀、十佳球一网打尽</span></div></article>
      <article class="xb-card"><div class="xb-thumb"></div><div class="xb-meta"><b>赛事数据</b><span>球队排行 · 球员技术统计</span></div></article>
      <article class="xb-card"><div class="xb-thumb"></div><div class="xb-meta"><b>我的关注</b><span>收藏球队 · 订阅提醒</span></div></article>
    </main>
  </div>

  <!-- 下导航：5 个标签，图标为内联 SVG（stroke 风格，与字体图标方案技术区别） -->
  <nav class="xb-tabbar" aria-label="徐奔-下导航-SVG">
    <a href="#" class="is-active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>首页</span>
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="6" cy="6" r="1.4" fill="currentColor"/><circle cx="6" cy="12" r="1.4" fill="currentColor"/><circle cx="6" cy="18" r="1.4" fill="currentColor"/></svg>
      <span>赛程</span>
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 9.5v5l4-2.5z" fill="currentColor"/></svg>
      <span>视频</span>
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z" fill="currentColor"/></svg>
      <span>发现</span>
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>我的</span>
    </a>
  </nav>
</body>
</html>
