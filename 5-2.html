<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        body,ul,p,h1,h2,h3,h4,h5,h5{
            margin: 0;
            padding: 0;
        }
        ul{
            list-style: none;
        }
        .a{
            width: 500px;
            height: 500px;
            border: 2px dotted #039;
            padding: 70px 60px 50px 40px;
            margin: 40px auto;

            width: 500px;
            height: 300px;
            border: 2px dashed #039;
            margin: 50px auto 40px;
        }
        .c{
            width: 500px;
            height: 200px;
            border: 2px solid #039;
            margin: 0 auto 40px;
        }
    </style>
</head>
<body>
    <div class="a">1011徐奔</div>
    <div class="b">1011徐奔</div>
    <div class="c">1011徐奔</div>

</html>
